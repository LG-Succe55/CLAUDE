<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Amplified — Visuals Only</title>
<style>
:root {
  --bg: #000000;
  --ink: #F4F1E8;
  --acid: #C8FF1F;
  --acid-glow: rgba(200, 255, 31, 0.55);
  --line: rgba(244, 241, 232, 0.18);
  --line-strong: rgba(244, 241, 232, 0.32);
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  height: 100%;
  width: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}
.deck {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: calc(100vh * 16 / 9);
  max-height: calc(100vw * 9 / 16);
  background: var(--bg);
  overflow: hidden;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.2s var(--ease), visibility 0s 1.2s;
  background: var(--bg);
  overflow: hidden;
}
.slide.active {
  opacity: 1;
  visibility: visible;
  transition: opacity 1.2s var(--ease), visibility 0s 0s;
}

.slide-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* Structural placeholders — abstract reveal cadence */
.placeholder {
  position: absolute;
  z-index: 2;
  pointer-events: none;
}
.ph-row {
  height: 1px;
  background: rgba(244,241,232,0.18);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 1s var(--ease);
}
.slide.active .ph-row { transform: scaleX(1); }

.ph-bar {
  background: rgba(244,241,232,0.10);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
}
.slide.active .ph-bar { opacity: 1; transform: translateY(0); }
.ph-bar.acid { background: var(--acid-glow); }

/* Slide-specific placeholder layouts */

/* S2 milestones — track + 5 dots already in canvas */
/* S3 numbers — 4 placeholder zones */
.s3-grid {
  position: absolute;
  inset: 10vh 8vw;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3vw;
  align-items: end;
}
.s3-cell {
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.4s var(--ease), transform 1.4s var(--ease);
}
.slide.active .s3-cell { opacity: 1; transform: translateY(0); }
.slide.active .s3-cell:nth-child(1) { transition-delay: 0.5s; }
.slide.active .s3-cell:nth-child(2) { transition-delay: 0.85s; }
.slide.active .s3-cell:nth-child(3) { transition-delay: 1.2s; }
.slide.active .s3-cell:nth-child(4) { transition-delay: 1.55s; }
.s3-num {
  height: clamp(56px, 9vw, 168px);
  background: linear-gradient(180deg, rgba(244,241,232,0.16), rgba(244,241,232,0.06));
  border-radius: 2px;
}
.s3-cell.lead .s3-num {
  background: linear-gradient(180deg, rgba(200,255,31,0.3), rgba(200,255,31,0.08));
  box-shadow: 0 0 24px var(--acid-glow);
}
.s3-label {
  width: 60%;
  height: 1px;
  background: rgba(244,241,232,0.2);
}

/* S4/S6 — 5 horizontal bars revealing */
.s4-stack {
  position: absolute;
  bottom: 10vh;
  left: 8vw;
  width: 40vw;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 1.6vw, 22px);
}
.s4-row {
  height: 1px;
  background: rgba(244,241,232,0.22);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 1.1s var(--ease);
}
.slide.active .s4-row:nth-child(1) { transition-delay: 0.5s; transform: scaleX(1); }
.slide.active .s4-row:nth-child(2) { transition-delay: 0.85s; transform: scaleX(1); }
.slide.active .s4-row:nth-child(3) { transition-delay: 1.2s; transform: scaleX(1); }
.slide.active .s4-row:nth-child(4) { transition-delay: 1.55s; transform: scaleX(1); }
.slide.active .s4-row:nth-child(5) { transition-delay: 1.9s; transform: scaleX(1); background: var(--acid); box-shadow: 0 0 12px var(--acid-glow); }

/* S10/S18 — horizon timeline 4 stops in canvas */
/* S15/S16 — day timeline rows */
.day-grid {
  position: absolute;
  left: 8vw;
  right: 8vw;
  top: 30vh;
  bottom: 18vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.day-bar {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 40px;
  align-items: center;
}
.day-time {
  height: 1px;
  background: rgba(244,241,232,0.4);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 0.9s var(--ease);
}
.day-scene {
  height: 1px;
  background: rgba(244,241,232,0.15);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 1.2s var(--ease) 0.15s;
}
.slide.active .day-bar:nth-of-type(1) .day-time,
.slide.active .day-bar:nth-of-type(1) .day-scene { transition-delay: 0.5s; transform: scaleX(1); }
.slide.active .day-bar:nth-of-type(2) .day-time,
.slide.active .day-bar:nth-of-type(2) .day-scene { transition-delay: 0.8s; transform: scaleX(1); }
.slide.active .day-bar:nth-of-type(3) .day-time,
.slide.active .day-bar:nth-of-type(3) .day-scene { transition-delay: 1.1s; transform: scaleX(1); }
.slide.active .day-bar:nth-of-type(4) .day-time,
.slide.active .day-bar:nth-of-type(4) .day-scene { transition-delay: 1.4s; transform: scaleX(1); }
.slide.active .day-bar:nth-of-type(5) .day-time,
.slide.active .day-bar:nth-of-type(5) .day-scene { transition-delay: 1.7s; transform: scaleX(1); }
.day-grid.flow .day-time { background: var(--acid); box-shadow: 0 0 8px var(--acid-glow); }
.day-grid.flow .day-scene { background: rgba(244,241,232,0.3); }
.day-grid.flow::before {
  content: '';
  position: absolute;
  left: 50px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(200,255,31,0.3) 15%, rgba(200,255,31,0.3) 85%, transparent);
}

/* S17 review — 3 columns of vertical hairlines */
.review-grid {
  position: absolute;
  inset: 20vh 8vw 18vh;
  display: grid;
  grid-template-columns: 1fr 1.3fr 1fr;
  gap: 4vw;
}
.review-col { display: flex; flex-direction: column; gap: clamp(12px, 1.5vw, 18px); padding-top: 32px; border-top: 1px solid var(--line); }
.review-col.center {
  border: 1px solid rgba(200,255,31,0.3);
  background: radial-gradient(ellipse at center, rgba(200,255,31,0.08), transparent 70%);
  padding: 32px;
  border-radius: 3px;
}
.review-col.acid { border-top-color: var(--acid); }
.review-col .r-row {
  height: 1px;
  background: rgba(244,241,232,0.16);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 1s var(--ease);
}
.review-col.acid .r-row { background: rgba(200,255,31,0.4); box-shadow: 0 0 6px var(--acid-glow); }
.slide.active .review-col.left .r-row:nth-child(1) { transition-delay: 0.5s; transform: scaleX(1); }
.slide.active .review-col.left .r-row:nth-child(2) { transition-delay: 0.65s; transform: scaleX(1); }
.slide.active .review-col.left .r-row:nth-child(3) { transition-delay: 0.8s; transform: scaleX(1); }
.slide.active .review-col.left .r-row:nth-child(4) { transition-delay: 0.95s; transform: scaleX(1); }
.slide.active .review-col.center .r-block { opacity: 1; }
.slide.active .review-col.acid .r-row:nth-child(1) { transition-delay: 0.8s; transform: scaleX(1); }
.slide.active .review-col.acid .r-row:nth-child(2) { transition-delay: 0.95s; transform: scaleX(1); }
.slide.active .review-col.acid .r-row:nth-child(3) { transition-delay: 1.1s; transform: scaleX(1); }
.slide.active .review-col.acid .r-row:nth-child(4) { transition-delay: 1.25s; transform: scaleX(1); }
.r-block {
  width: 60%;
  height: 2px;
  background: var(--acid);
  box-shadow: 0 0 14px var(--acid-glow);
  opacity: 0;
  transition: opacity 1.4s var(--ease) 1.0s;
}

/* S18 success — 2 columns of horizontal bars */
.success-grid {
  position: absolute;
  inset: 20vh 8vw 18vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6vw;
  align-content: center;
}
.success-col { display: flex; flex-direction: column; gap: clamp(14px, 2vw, 22px); }
.success-row {
  height: 1px;
  background: rgba(244,241,232,0.18);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 1s var(--ease);
}
.success-col.future .success-row { background: var(--acid); box-shadow: 0 0 8px var(--acid-glow); transform-origin: right; }
.slide.active .success-col.today .success-row:nth-child(1) { transition-delay: 0.5s; transform: scaleX(1); }
.slide.active .success-col.today .success-row:nth-child(2) { transition-delay: 0.65s; transform: scaleX(1); }
.slide.active .success-col.today .success-row:nth-child(3) { transition-delay: 0.8s; transform: scaleX(1); }
.slide.active .success-col.today .success-row:nth-child(4) { transition-delay: 0.95s; transform: scaleX(1); }
.slide.active .success-col.today .success-row:nth-child(5) { transition-delay: 1.1s; transform: scaleX(1); }
.slide.active .success-col.future .success-row:nth-child(1) { transition-delay: 0.5s; transform: scaleX(1); }
.slide.active .success-col.future .success-row:nth-child(2) { transition-delay: 0.65s; transform: scaleX(1); }
.slide.active .success-col.future .success-row:nth-child(3) { transition-delay: 0.8s; transform: scaleX(1); }
.slide.active .success-col.future .success-row:nth-child(4) { transition-delay: 0.95s; transform: scaleX(1); }
.slide.active .success-col.future .success-row:nth-child(5) { transition-delay: 1.1s; transform: scaleX(1); }

/* Year mark numerals — visible structure */
.year-stage {
  position: absolute;
  inset: 0;
}
.year-num {
  position: absolute;
  top: 14vh;
  left: 8vw;
  font-family: 'Space Grotesk', serif;
  font-weight: 300;
  font-size: clamp(140px, 22vw, 360px);
  line-height: 0.85;
  letter-spacing: -0.055em;
  color: var(--ink);
  z-index: 3;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.6s var(--ease) 0.2s, transform 1.6s var(--ease) 0.2s;
}
.year-num em { font-style: italic; color: var(--acid); }
.slide.active .year-num { opacity: 1; transform: translateY(0); }

/* Nav */
.nav-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 16px;
  background: rgba(8, 8, 10, 0.7);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 999px;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.5s var(--ease);
  pointer-events: none;
}
.nav-bar.visible { opacity: 1; pointer-events: auto; }
.nav-btn {
  background: transparent;
  border: none;
  color: var(--ink);
  width: 26px; height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  font-family: var(--mono);
}
.nav-btn:hover { background: rgba(244,241,232,0.1); color: var(--acid); }
.slide-count {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: rgba(244,241,232,0.5);
}
.slide-count .cur { color: var(--ink); }
.edge-progress {
  position: fixed;
  bottom: 0; left: 0;
  height: 2px;
  background: var(--acid);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 0.5s var(--ease);
  z-index: 999;
  box-shadow: 0 0 10px var(--acid-glow);
  opacity: 0.5;
}
</style>
</head>
<body>

<script>
// ============================================================
// ROTATING WIREFRAME GLOBE
// ============================================================
class Globe {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.started = false;
    this.rafId = null;
    this.resize();
    this._init();
  }

  resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = rect.width;
    this.h = rect.height;
  }

  _init() {
    this.cx = this.w / 2;
    this.cy = this.h / 2;
    this.radius = Math.min(this.w, this.h) * 0.34;
    this.tilt = 0.32;
    this.rotSpeed = 0.00018;
    this.startTime = 0;

    // Sample landmass dots
    this.landDots = [];
    const isLand = (lat, lng) => {
      if (lat >= 25 && lat <= 72 && lng >= -140 && lng <= -52) {
        if (lng < -128 && lat < 49) return false;
        if (lng > -82 && lat < 30) return false;
        if (lng > -68 && lat > 50) return false;
        if (lat > 65 && lng > -95) return false;
        if (lat > 70 && lng < -125) return false;
        return true;
      }
      if (lat >= 56 && lat <= 71 && lng >= -168 && lng <= -141) return true;
      if (lat >= 8 && lat <= 32 && lng >= -118 && lng <= -82) {
        if (lat < 17 && lng < -100) return false;
        if (lat < 12 && lng > -85) return false;
        return true;
      }
      if (lat >= 60 && lat <= 75 && lng >= -55 && lng <= -20) return true;
      if (lat >= -55 && lat <= 12 && lng >= -82 && lng <= -34) {
        if (lat < -25 && lng < -72) return false;
        if (lat < -20 && lng > -45) return false;
        if (lat > 5 && lng < -75) return false;
        if (lat < -38 && lng > -65) return false;
        return true;
      }
      if (lat >= 36 && lat <= 71 && lng >= -10 && lng <= 50) {
        if (lat > 60 && lng > 30) return false;
        if (lat < 40 && lng > 28) return false;
        return true;
      }
      if (lat >= 50 && lat <= 60 && lng >= -10 && lng <= 2) return true;
      if (lat >= 55 && lat <= 71 && lng >= 5 && lng <= 30) return true;
      if (lat >= -35 && lat <= 37 && lng >= -18 && lng <= 52) {
        if (lat < -10 && lng > 40) return false;
        if (lat > 20 && lng < -10) return false;
        if (lat > 30 && lng > 30) return false;
        return true;
      }
      if (lat >= 8 && lat <= 78 && lng >= 30 && lng <= 145) {
        if (lat < 18 && lng > 105) return false;
        if (lat > 70 && lng < 60) return false;
        return true;
      }
      if (lat >= 50 && lat <= 75 && lng >= 100 && lng <= 180) return true;
      if (lat >= 30 && lat <= 46 && lng >= 130 && lng <= 146) return true;
      if (lat >= -10 && lat <= 8 && lng >= 95 && lng <= 142) return true;
      if (lat >= 5 && lat <= 20 && lng >= 117 && lng <= 127) return true;
      if (lat >= -40 && lat <= -10 && lng >= 112 && lng <= 154) return true;
      if (lat >= -47 && lat <= -34 && lng >= 165 && lng <= 178) return true;
      return false;
    };
    for (let lat = -60; lat <= 75; lat += 3.5) {
      for (let lng = -180; lng < 180; lng += 4.5) {
        if (isLand(lat, lng)) {
          this.landDots.push({ lat, lng });
        }
      }
    }

    // Five highlighted countries
    this.countries = [
      { name: 'USA',    lat: 39,  lng: -98 },
      { name: 'France', lat: 46,  lng: 2 },
      { name: 'Italy',  lat: 42,  lng: 12 },
      { name: 'Brazil', lat: -14, lng: -52 },
      { name: 'China',  lat: 35,  lng: 103 }
    ];

    // Pre-compute great-circle arc samples between each pair
    this.arcs = [];
    for (let i = 0; i < this.countries.length; i++) {
      for (let j = i + 1; j < this.countries.length; j++) {
        this.arcs.push({
          a: this.countries[i],
          b: this.countries[j],
          phase: Math.random() * Math.PI * 2,
          pulseOffset: Math.random() * 2400
        });
      }
    }
  }

  // 3D project (lat, lng) on a sphere -> screen coords with depth
  _project(lat, lng, rotation) {
    const latR = lat * Math.PI / 180;
    const lngR = (lng * Math.PI / 180) + rotation;
    let x = Math.cos(latR) * Math.sin(lngR);
    let y = Math.sin(latR);
    let z = Math.cos(latR) * Math.cos(lngR);
    // tilt around X axis
    const c = Math.cos(this.tilt), s = Math.sin(this.tilt);
    const y2 = y * c - z * s;
    const z2 = y * s + z * c;
    return {
      x: this.cx + x * this.radius,
      y: this.cy - y2 * this.radius,
      z: z2,
      visible: z2 > -0.02
    };
  }

  // Spherical linear interpolation between two lat/lng points
  _slerp(a, b, t) {
    const aLat = a.lat * Math.PI / 180;
    const aLng = a.lng * Math.PI / 180;
    const bLat = b.lat * Math.PI / 180;
    const bLng = b.lng * Math.PI / 180;
    const A = {
      x: Math.cos(aLat) * Math.cos(aLng),
      y: Math.sin(aLat),
      z: Math.cos(aLat) * Math.sin(aLng)
    };
    const B = {
      x: Math.cos(bLat) * Math.cos(bLng),
      y: Math.sin(bLat),
      z: Math.cos(bLat) * Math.sin(bLng)
    };
    const dot = A.x * B.x + A.y * B.y + A.z * B.z;
    const omega = Math.acos(Math.max(-1, Math.min(1, dot)));
    if (omega < 0.001) return a;
    const sinO = Math.sin(omega);
    const w1 = Math.sin((1 - t) * omega) / sinO;
    const w2 = Math.sin(t * omega) / sinO;
    const x = A.x * w1 + B.x * w2;
    const y = A.y * w1 + B.y * w2;
    const z = A.z * w1 + B.z * w2;
    return {
      lat: Math.asin(y) * 180 / Math.PI,
      lng: Math.atan2(z, x) * 180 / Math.PI
    };
  }

  start() {
    if (this.started) return;
    this.started = true;
    this.startTime = performance.now();
    this._loop();
  }
  stop() {
    this.started = false;
    if (this.rafId) cancelAnimationFrame(this.rafId);
  }
  _loop() {
    if (!this.started) return;
    const elapsed = performance.now() - this.startTime;
    this._render(elapsed);
    this.rafId = requestAnimationFrame(() => this._loop());
  }

  _render(elapsed) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);
    const rotation = elapsed * this.rotSpeed;

    // ===== Wireframe sphere outline (great-circle equator) =====
    // Subtle sphere edge halo
    ctx.beginPath();
    ctx.arc(this.cx, this.cy, this.radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(244,241,232,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Latitude lines
    for (let lat = -60; lat <= 60; lat += 15) {
      let lastVisible = false;
      ctx.beginPath();
      for (let lng = -180; lng <= 180; lng += 5) {
        const p = this._project(lat, lng, rotation);
        if (p.visible) {
          const fade = Math.max(0, p.z + 0.2) / 1.2;
          if (!lastVisible) {
            ctx.moveTo(p.x, p.y);
          } else {
            ctx.lineTo(p.x, p.y);
          }
          lastVisible = true;
        } else {
          if (lastVisible) {
            ctx.stroke();
            ctx.beginPath();
          }
          lastVisible = false;
        }
      }
      ctx.strokeStyle = lat === 0 ? 'rgba(244,241,232,0.18)' : 'rgba(244,241,232,0.08)';
      ctx.lineWidth = lat === 0 ? 0.7 : 0.5;
      ctx.stroke();
    }

    // Longitude lines
    for (let lng = -180; lng < 180; lng += 20) {
      let lastVisible = false;
      ctx.beginPath();
      for (let lat = -85; lat <= 85; lat += 3) {
        const p = this._project(lat, lng, rotation);
        if (p.visible) {
          if (!lastVisible) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
          lastVisible = true;
        } else {
          if (lastVisible) { ctx.stroke(); ctx.beginPath(); }
          lastVisible = false;
        }
      }
      ctx.strokeStyle = 'rgba(244,241,232,0.08)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // ===== Land dots =====
    for (const d of this.landDots) {
      const p = this._project(d.lat, d.lng, rotation);
      if (p.visible) {
        const fade = Math.max(0, p.z + 0.1) / 1.1;
        ctx.fillStyle = `rgba(244,241,232,${0.30 * fade})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ===== Inter-country great-circle arcs =====
    for (const arc of this.arcs) {
      let lastVisible = false;
      ctx.beginPath();
      for (let t = 0; t <= 1.001; t += 0.025) {
        const pt = this._slerp(arc.a, arc.b, t);
        const p = this._project(pt.lat, pt.lng, rotation);
        if (p.visible) {
          if (!lastVisible) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
          lastVisible = true;
        } else {
          if (lastVisible) { ctx.stroke(); ctx.beginPath(); }
          lastVisible = false;
        }
      }
      ctx.strokeStyle = 'rgba(200,255,31,0.55)';
      ctx.lineWidth = 1.2;
      ctx.shadowColor = 'rgba(200,255,31,0.6)';
      ctx.shadowBlur = 6;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Traveling pulse along the arc
      const pulseT = (((elapsed + arc.pulseOffset) / 3400) % 1);
      const pt = this._slerp(arc.a, arc.b, pulseT);
      const pp = this._project(pt.lat, pt.lng, rotation);
      if (pp.visible) {
        const pulseA = Math.sin(pulseT * Math.PI);
        ctx.fillStyle = `rgba(200,255,31,${0.9 * pulseA})`;
        ctx.shadowColor = 'rgba(200,255,31,0.8)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(pp.x, pp.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // ===== Country markers + labels =====
    for (const c of this.countries) {
      const p = this._project(c.lat, c.lng, rotation);
      if (!p.visible) continue;
      const fade = Math.max(0, p.z + 0.05) / 1.05;
      const pulse = 0.85 + 0.15 * Math.sin(elapsed / 700);
      // Outer halo ring
      ctx.beginPath();
      ctx.arc(p.x, p.y, 10 * fade, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,255,31,${0.3 * fade})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      // Filled marker
      ctx.fillStyle = `rgba(200,255,31,${pulse * fade})`;
      ctx.shadowColor = 'rgba(200,255,31,0.7)';
      ctx.shadowBlur = 16 * fade;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5 * fade, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Label
      if (p.z > 0.1) {
        ctx.font = '600 14px "Inter", system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgba(244,241,232,${0.95 * fade})`;
        ctx.shadowColor = 'rgba(0,0,0,0.85)';
        ctx.shadowBlur = 5;
        ctx.fillText(c.name, p.x + 14, p.y - 1);
        ctx.shadowBlur = 0;
      }
    }
  }
}

// ============================================================
// NODE GRAPH ENGINE — reuse the existing builders, dark only
// ============================================================
class NodeGraph {
  constructor(canvas, config) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.config = config;
    this.nodes = [];
    this.edges = [];
    this.started = false;
    this.rafId = null;
    this.resize();
    this._build();
  }

  resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = rect.width;
    this.h = rect.height;
  }

  _build() {
    const t = this.config.type;
    switch (t) {
      case 'dense-atmospheric': this._ambient(320, 0.55); break;
      case 'dense-atmospheric-quiet': this._ambient(280, 0.45); break;
      case 'atmospheric-sparse': this._ambient(60, 0.18); break;
      case 'atmospheric-faint': this._ambient(80, 0.22); break;
      case 'atmospheric-very-faint': this._ambient(40, 0.12); break;
      case 'silent': this._ambient(20, 0.08); break;
      case 'milestones-track': this._buildMilestones(); break;
      case 'horizon-track': this._buildHorizon(); break;
      case 'capability-spread': this._buildCapabilitySpread(); break;
      case 'designer-orbit': this._buildDesignerOrbit(); break;
      case 'collective-network': this._buildCollectiveNetwork(); break;
      case 'growing-organism': this._buildGrowingOrganism(); break;
      case 'dense-graph-hero': this._buildDenseHero(); break;
      default: this._ambient(60, 0.18);
    }
  }

  _ambient(count, alphaScale) {
    for (let i = 0; i < count; i++) {
      this.nodes.push({
        x: Math.random() * this.w,
        y: Math.random() * this.h,
        vx: (Math.random() - 0.5) * 0.06,
        vy: (Math.random() - 0.5) * 0.06,
        r: 0.6 + Math.random() * 1.6,
        a: 0.1 + Math.random() * alphaScale,
        glow: Math.random() < 0.05,
        phase: Math.random() * Math.PI * 2,
        ambient: true
      });
    }
  }

  _buildMilestones() {
    // Horizontal track at y = 0.55
    const trackY = this.h * 0.55;
    const left = this.w * 0.08;
    const right = this.w * 0.92;
    const stops = 5;
    for (let i = 0; i < stops; i++) {
      const x = left + (right - left) * (i / (stops - 1));
      this.nodes.push({
        x, y: trackY,
        r: 7, a: 1, glow: true,
        color: '#C8FF1F',
        phase: Math.random() * Math.PI * 2,
        appearDelay: 600 + i * 700
      });
    }
    // Pulse traveling along track
    this.trackY = trackY;
    this.trackLeft = left;
    this.trackRight = right;
    this._ambient(40, 0.12);
  }

  _buildHorizon() {
    const trackY = this.h * 0.55;
    const left = this.w * 0.08;
    const right = this.w * 0.92;
    const stops = 4;
    for (let i = 0; i < stops; i++) {
      const x = left + (right - left) * (i / (stops - 1));
      this.nodes.push({
        x, y: trackY,
        r: 8, a: 1, glow: true,
        color: '#C8FF1F',
        phase: Math.random() * Math.PI * 2,
        appearDelay: 400 + i * 800
      });
    }
    this.trackY = trackY;
    this.trackLeft = left;
    this.trackRight = right;
    this._ambient(40, 0.12);
  }

  _buildCapabilitySpread() {
    const cx = this.w * 0.62, cy = this.h * 0.42;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const r = 24 + Math.random() * 16;
      this.nodes.push({
        x: cx + Math.cos(a) * r,
        y: cy + Math.sin(a) * r,
        r: 4, a: 0.92, glow: true,
        color: '#C8FF1F',
        phase: Math.random() * Math.PI * 2,
        appearDelay: i * 140
      });
    }
    this.growth = [];
    let delay = 900;
    for (let i = 0; i < 42; i++) {
      const a = Math.random() * Math.PI * 2;
      const ring = 60 + (i / 42) * 220 + Math.random() * 40;
      this.growth.push({
        appear: delay,
        attachIdx: Math.floor(Math.random() * Math.min(5 + i, 14)),
        x: Math.max(20, Math.min(this.w - 20, cx + Math.cos(a) * ring)),
        y: Math.max(20, Math.min(this.h - 20, cy + Math.sin(a) * ring)),
        r: 2 + Math.random() * 2,
        glow: Math.random() < 0.15
      });
      delay += 140 + Math.random() * 160;
    }
    this._ambient(40, 0.10);
  }

  _buildDesignerOrbit() {
    const cx = this.w * 0.5, cy = this.h * 0.5;
    this.nodes.push({
      x: cx, y: cy, r: 12, a: 1, glow: true,
      color: '#F4F1E8',
      phase: 0
    });
    const cIdx = this.nodes.length - 1;
    const rings = [
      { count: 6, radius: this.h * 0.16, speed: 0.0003, alpha: 0.55 },
      { count: 12, radius: this.h * 0.26, speed: 0.00018, alpha: 0.38 },
      { count: 20, radius: this.h * 0.36, speed: 0.00012, alpha: 0.25 }
    ];
    rings.forEach((ring, ri) => {
      for (let i = 0; i < ring.count; i++) {
        const a0 = (i / ring.count) * Math.PI * 2;
        this.nodes.push({
          x: cx + Math.cos(a0) * ring.radius,
          y: cy + Math.sin(a0) * ring.radius,
          orbitCx: cx, orbitCy: cy,
          orbitR: ring.radius,
          orbitA: a0,
          orbitSpeed: ring.speed,
          r: 2 + Math.random() * 1.6,
          a: ring.alpha,
          glow: Math.random() < 0.2,
          color: '#C8FF1F',
          phase: Math.random() * Math.PI * 2,
          appearDelay: ri * 250 + i * 30,
          orbit: true
        });
        if (ri === 0 && Math.random() < 0.4) {
          this.edges.push({
            a: cIdx, b: this.nodes.length - 1,
            alpha: 0.22, ambient: true,
            appearDelay: ri * 250 + 200
          });
        }
      }
    });
    this._ambient(30, 0.08);
  }

  _buildCollectiveNetwork() {
    const cx = this.w * 0.5, cy = this.h * 0.5;
    const positions = [
      { x: 0.5, y: 0.5 },
      { x: 0.32, y: 0.36 },
      { x: 0.68, y: 0.36 },
      { x: 0.32, y: 0.64 },
      { x: 0.68, y: 0.64 },
      { x: 0.22, y: 0.5 },
      { x: 0.78, y: 0.5 }
    ];
    const start = this.nodes.length;
    positions.forEach((p, i) => {
      this.nodes.push({
        x: p.x * this.w, y: p.y * this.h,
        r: i === 0 ? 8 : 6,
        a: 0.95,
        glow: true,
        color: i === 0 ? '#F4F1E8' : '#C8FF1F',
        phase: Math.random() * Math.PI * 2,
        appearDelay: 200 + i * 200
      });
    });
    for (let i = 0; i < positions.length; i++) {
      for (let j = i + 1; j < positions.length; j++) {
        this.edges.push({
          a: start + i, b: start + j,
          alpha: 0.16 + Math.random() * 0.08,
          appearDelay: 800 + (i + j) * 100,
          pulse: true,
          pulseOffset: Math.random() * 3000,
          pulsePeriod: 2400 + Math.random() * 1600
        });
      }
    }
    this._ambient(50, 0.10);
  }

  _buildGrowingOrganism() {
    const seedPositions = [
      { x: 0.5, y: 0.5 },
      { x: 0.56, y: 0.55 },
      { x: 0.44, y: 0.55 }
    ];
    seedPositions.forEach((p, i) => {
      this.nodes.push({
        x: p.x * this.w, y: p.y * this.h,
        r: 6, a: 0.95, glow: true,
        color: '#C8FF1F',
        phase: Math.random() * Math.PI * 2,
        appearDelay: i * 200
      });
    });
    this.growth = [];
    let delay = 600;
    for (let i = 0; i < 56; i++) {
      const attachIdx = Math.floor(Math.random() * Math.min(this.nodes.length + i, 18));
      const seedRef = seedPositions[Math.min(attachIdx, seedPositions.length - 1)];
      const baseX = seedRef.x * this.w;
      const baseY = seedRef.y * this.h;
      const ang = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 220 + i * 3.5;
      this.growth.push({
        appear: delay,
        attachIdx,
        x: Math.max(20, Math.min(this.w - 20, baseX + Math.cos(ang) * dist)),
        y: Math.max(20, Math.min(this.h - 20, baseY + Math.sin(ang) * dist)),
        r: 2 + Math.random() * 2.2,
        glow: Math.random() < 0.22
      });
      delay += 180 + Math.random() * 180;
    }
    this._ambient(60, 0.10);
  }

  _buildDenseHero() {
    const galaxies = [
      { cx: 0.5, cy: 0.42, count: 22 },
      { cx: 0.6, cy: 0.55, count: 18 },
      { cx: 0.4, cy: 0.58, count: 16 }
    ];
    const positions = [];
    galaxies.forEach(g => {
      for (let i = 0; i < g.count; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * Math.min(this.w, this.h) * 0.18;
        positions.push({
          x: g.cx * this.w + Math.cos(a) * r,
          y: g.cy * this.h + Math.sin(a) * r,
          hub: i < 2
        });
      }
    });
    const start = this.nodes.length;
    positions.forEach((p, i) => {
      this.nodes.push({
        x: p.x, y: p.y,
        r: p.hub ? 5 : 3,
        a: 0.9, glow: p.hub,
        color: p.hub ? '#C8FF1F' : '#F4F1E8',
        phase: Math.random() * Math.PI * 2,
        appearDelay: i * 50
      });
    });
    for (let i = 0; i < positions.length; i++) {
      const candidates = [];
      for (let j = 0; j < positions.length; j++) {
        if (i === j) continue;
        const d = Math.hypot(positions[i].x - positions[j].x, positions[i].y - positions[j].y);
        candidates.push({ idx: j, d });
      }
      candidates.sort((a, b) => a.d - b.d);
      const localCount = 2 + Math.floor(Math.random() * 3);
      for (let k = 0; k < localCount; k++) {
        if (Math.random() < 0.7) {
          this.edges.push({
            a: start + i, b: start + candidates[k].idx,
            alpha: 0.12 + Math.random() * 0.1,
            appearDelay: 800 + Math.random() * 1800,
            pulse: Math.random() < 0.3,
            pulseOffset: Math.random() * 3000,
            pulsePeriod: 3000 + Math.random() * 2000
          });
        }
      }
    }
    this._ambient(60, 0.10);
  }

  start() {
    if (this.started) return;
    this.started = true;
    this.startTime = performance.now();
    this._loop();
  }
  stop() {
    this.started = false;
    if (this.rafId) cancelAnimationFrame(this.rafId);
  }
  _loop() {
    if (!this.started) return;
    const elapsed = performance.now() - this.startTime;
    this._render(elapsed);
    this.rafId = requestAnimationFrame(() => this._loop());
  }

  _render(elapsed) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    // Track line for milestones / horizon
    if (this.trackY !== undefined) {
      ctx.beginPath();
      ctx.moveTo(this.trackLeft, this.trackY);
      ctx.lineTo(this.trackRight, this.trackY);
      ctx.strokeStyle = 'rgba(244,241,232,0.18)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Light pulse advancing across the track
      const tProgress = Math.min(1, elapsed / 4400);
      const pX = this.trackLeft + (this.trackRight - this.trackLeft) * tProgress;
      ctx.beginPath();
      ctx.moveTo(this.trackLeft, this.trackY);
      ctx.lineTo(pX, this.trackY);
      ctx.strokeStyle = 'rgba(200,255,31,0.7)';
      ctx.lineWidth = 1.2;
      ctx.shadowColor = 'rgba(200,255,31,0.6)';
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    if (this.growth) {
      for (const ev of this.growth) {
        if (ev.spawned) continue;
        if (elapsed >= ev.appear) {
          const newIdx = this.nodes.length;
          this.nodes.push({
            x: ev.x, y: ev.y,
            r: ev.r, a: 0.85,
            glow: ev.glow,
            color: ev.glow ? '#C8FF1F' : '#F4F1E8',
            phase: Math.random() * Math.PI * 2,
            appearDelay: elapsed
          });
          this.edges.push({
            a: ev.attachIdx, b: newIdx,
            alpha: 0.16, appearDelay: elapsed,
            pulse: Math.random() < 0.35,
            pulseOffset: 0, pulsePeriod: 2400
          });
          ev.spawned = true;
        }
      }
    }

    for (const n of this.nodes) {
      if (n.ambient) {
        n.x += n.vx || 0;
        n.y += n.vy || 0;
        if (n.x < 0 || n.x > this.w) n.vx *= -1;
        if (n.y < 0 || n.y > this.h) n.vy *= -1;
      } else if (n.orbit) {
        n.orbitA += n.orbitSpeed * 16;
        n.x = n.orbitCx + Math.cos(n.orbitA) * n.orbitR;
        n.y = n.orbitCy + Math.sin(n.orbitA) * n.orbitR;
      }
    }

    for (const e of this.edges) {
      const delay = e.appearDelay || 0;
      const t = Math.min(1, Math.max(0, (elapsed - delay) / 1200));
      if (t <= 0) continue;
      const a = this.nodes[e.a], b = this.nodes[e.b];
      if (!a || !b) continue;
      const x2 = a.x + (b.x - a.x) * t;
      const y2 = a.y + (b.y - a.y) * t;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(x2, y2);
      ctx.strokeStyle = `rgba(244,241,232,${e.alpha * t})`;
      ctx.lineWidth = 0.7;
      ctx.shadowBlur = 0;
      ctx.stroke();
      if (e.pulse && t >= 1) {
        const period = e.pulsePeriod || 2400;
        const offset = e.pulseOffset || 0;
        const ph = ((elapsed + offset) / period) % 1;
        const px = a.x + (b.x - a.x) * ph;
        const py = a.y + (b.y - a.y) * ph;
        const pulseA = Math.sin(ph * Math.PI);
        ctx.beginPath();
        ctx.arc(px, py, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,255,31,${0.9 * pulseA})`;
        ctx.shadowColor = 'rgba(200,255,31,0.8)';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (const n of this.nodes) {
      const delay = n.appearDelay || 0;
      const t = Math.min(1, Math.max(0, (elapsed - delay) / 900));
      if (t <= 0) continue;
      const pulse = n.glow ? 0.78 + 0.22 * Math.sin(elapsed / 900 + (n.phase || 0)) : 1;
      const r = (n.r || 2) * t;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      const color = n.color || (n.glow ? '#C8FF1F' : '#F4F1E8');
      const alpha = (n.a || 0.5) * t * pulse;
      ctx.fillStyle = this._rgba(color, alpha);
      if (n.glow) {
        ctx.shadowColor = this._rgba(color, 0.7);
        ctx.shadowBlur = 18 * pulse;
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  _rgba(hex, alpha) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
}

// ============================================================
// SLIDE MANAGER
// ============================================================
const slides = document.querySelectorAll('.slide');
const total = slides.length;
let current = 1;
const animations = new Map();

function showSlide(n) {
  if (n < 1) n = 1;
  if (n > total) n = total;
  if (animations.has(current)) animations.get(current).stop();
  current = n;
  slides.forEach((s, i) => s.classList.toggle('active', i === n - 1));
  document.getElementById('cur').textContent = String(n).padStart(2, '0');
  document.getElementById('edgeProgress').style.transform = `scaleX(${n / total})`;
  setTimeout(() => initSlide(n), 80);
}

function initSlide(n) {
  const slide = slides[n - 1];
  const canvas = slide.querySelector('.slide-canvas');
  if (!canvas) return;
  const type = slide.dataset.graph;
  if (animations.has(n)) animations.get(n).stop();
  let inst;
  if (type === 'rotating-globe') {
    inst = new Globe(canvas);
  } else {
    inst = new NodeGraph(canvas, { type });
  }
  animations.set(n, inst);
  inst.start();
}

function nextSlide() { showSlide(current + 1); }
function prevSlide() { showSlide(current - 1); }

let navTimer;
const navBar = document.getElementById('navBar');
document.addEventListener('mousemove', () => {
  navBar.classList.add('visible');
  clearTimeout(navTimer);
  navTimer = setTimeout(() => navBar.classList.remove('visible'), 2500);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  else if (e.key === 'Home') { showSlide(1); }
  else if (e.key === 'End') { showSlide(total); }
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
  }
});
document.addEventListener('click', (e) => {
  if (e.target.closest('.nav-bar')) return;
  nextSlide();
});
window.addEventListener('resize', () => { setTimeout(() => initSlide(current), 100); });

setTimeout(() => initSlide(1), 80);
showSlide(1);
</script>
